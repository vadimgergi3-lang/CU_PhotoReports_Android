name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show repository layout
        run: |
          echo "=== root ==="
          ls -la
          echo "=== android ==="
          ls -la android/ || echo "android/ MISSING"
          echo "=== .github/workflows ==="
          ls -la .github/workflows/ || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          # automake + libtool-bin нужны, чтобы autoreconf нашёл макрос
          # LT_SYS_SYMBOL_USCORE при сборке libffi.
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk autoconf automake libtool libtool-bin \
            m4 pkg-config zlib1g-dev libncurses-dev libncursesw5-dev libtinfo6 \
            cmake libffi-dev libssl-dev build-essential ccache

      - name: Expose libtool aclocal macros to the build
        run: |
          # обычный export не сохранится между шагами — пишем в $GITHUB_ENV
          echo "ACLOCAL_PATH=/usr/share/aclocal" >> "$GITHUB_ENV"
          echo "--- libtool.m4 / lt~obsolete.m4 на месте? ---"
          ls -l /usr/share/aclocal/libtool.m4 /usr/share/aclocal/lt*.m4 || true

      - name: Install buildozer and Cython
        run: |
          python -m pip install --upgrade pip
          pip install buildozer Cython==0.29.36

      - name: Prepare sources
        run: |
          if [ -f android/prepare.sh ]; then
            bash android/prepare.sh
          else
            echo "prepare.sh not found — using files already in android/"
            ls -la android/ || true
          fi
          # Fail early if critical files are missing
          test -f android/main.py
          test -f android/config.py
          test -f android/docgen.py
          test -f android/continue_report.py
          test -f android/buildozer.spec
          echo "All required android/ files present."

      - name: Build APK (debug)
        working-directory: android
        run: buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fotoreportcu-apk
          path: android/bin/*.apk
          if-no-files-found: error
